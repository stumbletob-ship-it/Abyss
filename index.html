      background: rgba(20,90,100,.55); color: #e8fbff; letter-spacing: .06em;
    }
    button:hover { background: rgba(30,130,145,.7); }
    button:disabled { opacity: .4; cursor: default; }
    button.secondary { background: transparent; font-weight: 500; font-size: 15px; }

    .controls { margin-top: 22px; font-size: 13px; line-height: 1.7; opacity: .7; text-align: left; }
    .controls b { color: #9fe7f0; }
    #loading { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; opacity: .5; z-index: 11; }
    #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 13px; opacity: .55; z-index: 5; pointer-events: none; }
  </style>

async function build() {
  $("btnVR").textContent = "Map wird gebaut \u2026";
  await new Promise((r) => setTimeout(r, 30));
  const t0 = performance.now();
  shared.causticMap.value = makeCausticTexture();
  shared.surfaceY.value = SURFACE;
  sea = new Underwater();
  sky = new Sky();
  scene.add(sea.group, sky.group);
  player = new Player(renderer, camera, renderer.domElement);
  scene.add(player.rig);
  player.teleport(0, SKY_Y, 3.2, 0);
  sea.group.visible = sky.group.visible = true;
  updateSeaLook(new THREE6.Vector3(0, 0, 0));
  try {
    renderer.compile(scene, camera);
  } catch (e) {
    console.warn(e);
  }
  setZone("sky");
  if (params.get("zone") === "sea") goToSea(true);
  if (params.has("cam")) {
    const [x, y, z, yaw, pitch] = params.get("cam").split(",").map(Number);
    const g = zone === "sea" ? sea.ground(x, z) : SKY_Y;
    player.teleport(x, (y ?? 0) + g, z, yaw || 0);
    player.pitch = pitch || 0;
    player.frozen = true;
  }
  console.log("Map gebaut in", Math.round(performance.now() - t0), "ms");
  ready = true;
  window.__ready = true;
  if (params.has("shot")) window.__dbg = { renderer, player, sea, get zone() {
    return zone;
  } };
  const vrBtn = $("btnVR");
  if (navigator.xr && await navigator.xr.isSessionSupported("immersive-vr").catch(() => false)) {
    vrBtn.disabled = false;
    vrBtn.textContent = "VR starten";
  } else {
    vrBtn.textContent = "VR nicht verf\xFCgbar";
    $("status").textContent = "\xD6ffne die Seite im Meta-Quest-Browser (HTTPS), um in VR zu spielen.";
  }
}
function goToSea(instant = false) {
  setZone("sea");
  const s = sea.spawn;
  player.teleport(s.x, s.y, s.z, s.yaw);
  if (!instant) audio.whoosh();
}
$("btnVR").addEventListener("click", async () => {
  try {
    const session = await navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor", "bounded-floor"] });
    audio.start();
    await renderer.xr.setSession(session);
    $("overlay").classList.add("hidden");
    const bl = renderer.xr.getBaseLayer();
    fxUniforms.viewH.value = bl && (bl.framebufferHeight || bl.textureHeight) || 1800;
    session.addEventListener("end", () => {
      $("overlay").classList.remove("hidden");
      fxUniforms.viewH.value = innerHeight * renderer.getPixelRatio();
    });
  } catch (e) {
    $("status").textContent = "VR konnte nicht gestartet werden: " + e.message;
  }
});
$("btnDesktop").addEventListener("click", () => {
  audio.start();
  $("overlay").classList.add("hidden");
  renderer.domElement.requestPointerLock?.();
});
renderer.domElement.addEventListener("click", () => {
  if (!renderer.xr.isPresenting && $("overlay").classList.contains("hidden")) renderer.domElement.requestPointerLock?.();
});
document.addEventListener("pointerlockchange", () => {
  $("hint").textContent = document.pointerLockElement ? "" : renderer.xr.isPresenting ? "" : "Klicken zum Steuern";
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (!renderer.xr.isPresenting) fxUniforms.viewH.value = innerHeight * renderer.getPixelRatio();
});
fxUniforms.viewH.value = innerHeight * renderer.getPixelRatio();
var clock = new THREE6.Clock();
var touchPts = [];
var time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  shared.time.value = time;
  if (!ready) {
    renderer.render(scene, camera);
    return;
  }
  const world = zone === "sea" ? sea : sky;
  if (!player.frozen && !transition) {
    player.update(dt, world, zone === "sea" ? { speed: 2.6, gravity: 2.6, terminal: 4.5, bounds: HALF - 12 } : { speed: 3.4, gravity: 9.8, terminal: 30 });
  }
  const head = player.head().clone();
  if (zone === "sky") {
    sky.update(dt, time, head);
    if (head.y < SKY_Y - 45) player.teleport(0, SKY_Y, 3.2, 0);
    if (!transition && sky.portalHit(player.handPositions(touchPts))) {
      transition = { t: 0, phase: "out" };
      fade.visible = true;
      audio.whoosh();
    }
  } else {
    sea.update(dt, time, head);
    updateSeaLook(head);
    audio.update(dt, head.y);
  }
  if (transition) {
    transition.t += dt;
    if (transition.phase === "out") {
      fadeMat.opacity = Math.min(1, transition.t / 0.45);
      if (transition.t >= 0.5) {
        goToSea(true);
        transition = { t: 0, phase: "in" };
      }
    } else {
      fadeMat.opacity = 1 - Math.min(1, transition.t / 1.4);
      if (transition.t >= 1.4) {
        transition = null;
        fade.visible = false;
      }
    }
  }
  renderer.render(scene, camera);
});
build().catch((e) => {
  console.error(e);
  $("status").textContent = "Fehler beim Laden: " + e.message;
});

</script>
</body>
