<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ABYSS VR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #02090c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #cfe9ee; }
    canvas { display: block; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, rgba(10,60,70,.55), rgba(1,6,9,.96) 70%);
      z-index: 10; transition: opacity .6s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .card { max-width: 520px; padding: 34px 38px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 54px; letter-spacing: .32em; font-weight: 800; color: #9fe7f0; text-shadow: 0 0 24px rgba(80,220,240,.35); padding-left: .32em; }
    .sub { margin: 0 0 28px; opacity: .7; letter-spacing: .12em; font-size: 14px; text-transform: uppercase; }
    button {
      display: block; width: 100%; margin: 12px 0; padding: 16px 20px; font-size: 18px; font-weight: 700;
      border-radius: 14px; border: 1px solid rgba(140,230,240,.45); cursor: pointer;
      background: rgba(20,90,100,.55); color: #e8fbff; letter-spacing: .06em;
    }
    button:hover { background: rgba(30,130,145,.7); }
    button:disabled { opacity: .4; cursor: default; }
    button.secondary { background: transparent; font-weight: 500; font-size: 15px; }
    #status { min-height: 20px; font-size: 13px; opacity: .75; margin-top: 8px; }
    .controls { margin-top: 22px; font-size: 13px; line-height: 1.7; opacity: .7; text-align: left; }
    .controls b { color: #9fe7f0; }
    #loading { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; opacity: .5; z-index: 11; }
    #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 13px; opacity: .55; z-index: 5; pointer-events: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="overlay">
    <div class="card">
      <h1>ABYSS</h1>
      <p class="sub">Unterwasser · VR</p>
      <button id="btnVR" disabled>Lädt …</button>
      <button id="btnDesktop" class="secondary">Im Browser testen (Maus + Tastatur)</button>
      <div id="status"></div>
      <div class="controls">
        <b>VR:</b> Linker Stick = laufen (drücken = schneller) · Rechter Stick = drehen<br />
        <b>Browser:</b> WASD = laufen · Maus = umsehen · Shift = schneller · Q/E = drehen · Esc = Maus freigeben<br />
        Berühre das Portal auf der Plattform, um abzutauchen.
      </div>
    </div>
  </div>
  <div id="hint"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
